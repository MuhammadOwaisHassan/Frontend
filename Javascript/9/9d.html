<!DOCTYPE html>
<html>
  <head>
    <title>9d</title>
  </head>
  <body>
    <input type="text" placeholder="Name" class="js-name-input" onkeydown="
        if (event.key === 'Enter'){
        displayMessage();
        }
    ">

    <button onclick="
    displayMessage();
    ">Submit</button>

    <p class="js-message"></p>
    
    <script>
        function displayMessage(){
            const inputElement = document.querySelector('.js-name-input');
            document.querySelector('.js-message').innerHTML =  `Your Name is: ${inputElement.value}`;
        }
    </script>
  </body>
</html>
