<!DOCTYPE html>
<html>
    <head>
        <title>
            DOM Projects
        </title>
    </head>
    <body>

        <p>Amazon Shipping Calculator</p>
        <input type="text" placeholder="Cost of Order" class="js-cost-input" onkeydown=" handleCostKeydown(event);">
        <button onclick="
        calculateTotal();
        ">Calculate</button>

        <p class="js-total-cost"></p>

        <script>

            function handleCostKeydown(event){
                // console.log(event.key);
                if (event.key === 'Enter'){
                calculateTotal();
                }
            }
            function calculateTotal(){
                const inputElement = document.querySelector('.js-cost-input');inputElement.value
                let cost = Number(inputElement.value)*100;

                if (cost <= 4000){
                    cost = Number(cost) + 1000
                    }

                document.querySelector('.js-total-cost').innerHTML = `$${cost/100}`
            }

        </script>
    </body>
</html>
