<html>
    <head>
        <title>5A</title>
    </head>
    <body>
        <script>
            let coffee = 5;
            let bagel = 3;
            let soup = 9;
            
            var cost = coffee + bagel * 2 + soup;

            let cost_tax = cost * 0.1;

            const totalCost = cost_tax + cost;

            console.log(`Cost of food : ${cost}`);
            console.log(`Tax : ${cost_tax}`);
            console.log(`Total cost : ${totalCost}`);
        </script>
    </body>
</html>
