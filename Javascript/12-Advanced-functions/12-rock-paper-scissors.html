<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="/Javascript/12-Advanced-functions/12-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button">
      <img src="/HTML/thumbnails/rock-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-paper-button">
      <img src="/HTML/thumbnails/paper-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-scissors-button">
      <img src="/HTML/thumbnails/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p> 
    <p class="js-score score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
    " class="reset-score-button">Reset Score</button>

    <button onclick="
    autoPlay();
    " class="auto-play-button">Autoplay</button>

    <script src="/Javascript/12-Advanced-functions/12-rock-paper-scissors.js"></script>
  </body>
</html>
