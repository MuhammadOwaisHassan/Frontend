<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <p>
           <button onclick="
            playGame('heads');
            ">heads</button>
            
            <button onclick="
            playGame('tails');
            ">tails</button>
    </p>
    <script>
        let score = {
            wins : 0,
            losses : 0
        };

        function playGame(guess){
            const randomnumber = Math.random();
            const result = randomnumber < 0.5? 'heads' : 'tails';

            console.log(guess===result ? 'You win!' : 'You lose!');

            if (guess===result){
                score.wins ++;
            } else{
                score.losses ++;
            }
            console.log(score);
        }
    </script>
  </body>
</html>
