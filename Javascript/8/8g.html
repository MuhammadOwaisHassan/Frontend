<!DOCTYPE html>
<html>

        <title>
            8g
        </title>
    </head>
    <body>
        <script>
            // simple version
            console.log('test'.repeat(2));

            // function
            const str = 'test';
            function printStringMultiplies(str,times){
                return str.repeat(times);
            };
            console.log(printStringMultiplies(str,5));

        </script>
    </body>
