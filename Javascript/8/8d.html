    <body>
        <script>
                
            const product1 = {
                name : 'basketball',
                price : 2000
            };
            
            const product2 = {
                name : 'basketball',
                price : 3000
            };
            
            function comparePrice(product1,product2){
                if (product1.price<product2.price){
                    return product1;
                } else {
                    return product2;
                }
            };

            console.log(comparePrice(product1,product2));

        </script>
