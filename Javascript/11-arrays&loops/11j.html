<!DOCTYPE html>
<html>
  <head>
    <title>11i</title>
  </head>
  <body>
    <script>
        function addArrays(array1,array2){
            let result = [];

            for(i=0; i<array1.length; i++){
                result.push(array1[i]+array2[i]);
            }
            return result;
        }
        console.log(addArrays([1,2,3],[2,3,4]));
    </script>
  </body>
</html>
