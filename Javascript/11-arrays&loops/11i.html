<!DOCTYPE html>
<html>
  <head>
    <title>11i</title>
  </head>
  <body>
    <script>
        function addNum(array,num){
            let result = [];

            for(i=0; i<array.length; i++){
                result.push(array[i]+num);
            }
            return result;
        }

        console.log(addNum([1,2,3],5));
    </script>
  </body>
</html>
