<!DOCTYPE html>
<html>
  <head>
    <title>11i</title>
  </head>
  <body>
    <script>
        function countPositive(nums){
            let result = 0;

            for(let i=0; i<nums.length; i++){
                if(nums[i]>0){
                    result++;
                }
            }
            return result;
        }
        console.log(countPositive([-5,-2,0,1,2,3]));
    </script>
  </body>
</html>
